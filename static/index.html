<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Docs</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2d3250;
    --accent: #4f7ef7;
    --accent2: #7c5cbf;
    --text: #e8eaf6;
    --muted: #7c83a3;
    --danger: #e74c3c;
    --warn: #f39c12;
    --success: #27ae60;
    --info: #2980b9;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Consolas', 'SF Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header .logo {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  header .logo span { color: var(--muted); font-weight: 400; }

  /* ── HERO / SEARCH ── */
  .hero {
    padding: 64px 24px 40px;
    text-align: center;
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
  }
  .hero h1 {
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 32px;
  }

  .search-box {
    display: flex;
    gap: 10px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    transition: border-color 0.2s;
  }
  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 126, 247, 0.15);
  }
  .search-box input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 1.05rem;
    font-family: var(--font);
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-box button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .search-box button:hover { background: #3a67e0; }
  .search-box button:active { transform: scale(0.97); }
  .search-box button:disabled { background: var(--muted); cursor: not-allowed; }

  /* example queries */
  .examples {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .example-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .example-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── RESULT AREA ── */
  #result-wrapper {
    max-width: 920px;
    margin: 0 auto 60px;
    width: 100%;
    padding: 0 24px;
    display: none;
  }
  #result-wrapper.visible { display: block; }

  .result-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .result-meta .query-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    color: var(--text);
    font-size: 0.85rem;
  }
  .source-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .source-chip {
    background: rgba(79,126,247,0.12);
    border: 1px solid rgba(79,126,247,0.3);
    color: var(--accent);
    border-radius: 12px;
    padding: 2px 10px;
    font-size: 0.78rem;
  }

  /* ── GENERATED DOC STYLES ── */
  #doc-output {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 40px;
    line-height: 1.7;
  }

  #doc-output .doc-header {
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    padding-bottom: 20px;
  }
  #doc-output .doc-header h1 {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    -webkit-text-fill-color: unset;
    background: none;
  }
  #doc-output .doc-header .meta {
    color: var(--muted);
    font-size: 0.85rem;
  }

  #doc-output .doc-section {
    margin-bottom: 32px;
  }
  #doc-output .doc-section h2 {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #doc-output .doc-section h2::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 18px;
    background: var(--accent);
    border-radius: 2px;
  }
  #doc-output .doc-section h3 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    margin: 18px 0 10px;
  }
  #doc-output p { margin-bottom: 12px; color: var(--text); }

  /* callouts */
  #doc-output .callout {
    border-left: 4px solid;
    border-radius: 0 8px 8px 0;
    padding: 14px 18px;
    margin: 18px 0;
    font-size: 0.93rem;
  }
  #doc-output .callout.danger {
    border-color: var(--danger);
    background: rgba(231,76,60,0.08);
    color: #f5a49a;
  }
  #doc-output .callout.warn {
    border-color: var(--warn);
    background: rgba(243,156,18,0.08);
    color: #f5cc7a;
  }
  #doc-output .callout.info {
    border-color: var(--info);
    background: rgba(41,128,185,0.08);
    color: #7ac6f5;
  }
  #doc-output .callout.success {
    border-color: var(--success);
    background: rgba(39,174,96,0.08);
    color: #7afaa8;
  }
  #doc-output .callout strong { display: block; margin-bottom: 4px; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.06em; }

  /* steps — counter lives on doc-section so it persists across multiple step-lists */
  #doc-output .doc-section {
    counter-reset: step;
  }
  #doc-output .step-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  #doc-output .step-item {
    display: grid;
    grid-template-columns: 32px 1fr;
    column-gap: 12px;
    margin-bottom: 16px;
  }
  #doc-output .step-item::before {
    counter-increment: step;
    content: counter(step);
    grid-column: 1;
    grid-row: 1;
    width: 28px;
    height: 28px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: #fff;
    justify-self: center;
    margin-top: 2px;
  }
  /* ALL direct children go into column 2 — prevents any child from
     auto-placing back into column 1 (32px) and going one-char-per-line */
  #doc-output .step-item > * {
    grid-column: 2;
    min-width: 0;
  }
  /* phase label sits between steps inside a step-list */
  #doc-output .step-phase {
    background: var(--surface2);
    border-left: 3px solid var(--accent);
    color: var(--accent);
    font-weight: 600;
    font-size: 0.9rem;
    padding: 8px 14px;
    border-radius: 0 6px 6px 0;
    margin: 8px 0 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* tables */
  #doc-output .data-table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 0.9rem;
  }
  #doc-output .data-table th {
    background: var(--surface2);
    color: var(--accent);
    padding: 10px 14px;
    text-align: left;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  #doc-output .data-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  #doc-output .data-table tr:hover td { background: var(--surface2); }

  /* images */
  #doc-output .img-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin: 14px 0;
    background: var(--surface2);
    display: inline-block;
    max-width: 100%;
  }
  #doc-output .img-card img {
    max-width: 100%;
    display: block;
  }
  #doc-output .img-card figcaption {
    padding: 8px 12px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  /* source tag */
  #doc-output .source-tag {
    display: inline-block;
    background: rgba(79,126,247,0.1);
    border: 1px solid rgba(79,126,247,0.25);
    color: var(--muted);
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 0.74rem;
    margin-left: 6px;
  }

  /* knowledge gap */
  #doc-output .knowledge-gap {
    background: rgba(243,156,18,0.06);
    border: 1px dashed var(--warn);
    border-radius: 8px;
    padding: 16px 20px;
    margin: 18px 0;
    font-size: 0.9rem;
    color: #f5cc7a;
  }
  #doc-output .knowledge-gap h4 {
    color: var(--warn);
    margin-bottom: 6px;
    text-transform: uppercase;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
  }

  /* ul/ol within output */
  #doc-output ul, #doc-output ol {
    padding-left: 22px;
    margin-bottom: 12px;
  }
  #doc-output li { margin-bottom: 5px; }

  /* code */
  #doc-output code {
    background: var(--surface2);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.88em;
    color: #a8d8ff;
  }

  /* ── LOADING STATE ── */
  .loading-bar {
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    margin-bottom: 20px;
    animation: pulse-bar 1.5s ease-in-out infinite;
    transform-origin: left;
  }
  @keyframes pulse-bar {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
  }

  /* ── CURSOR blink ── */
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

  /* ── FAVORITES BUTTON ── */
  #fav-toggle-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.82rem;
    font-family: var(--font);
    transition: border-color 0.15s, color 0.15s;
    display: none; /* shown via JS once favorites exist */
  }
  #fav-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── SAVE BUTTON in result meta ── */
  #save-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.82rem;
    font-family: var(--font);
    transition: all 0.15s;
    display: none;
  }
  #save-btn:hover { border-color: var(--accent); color: var(--accent); }
  #save-btn.saved { border-color: var(--warn); color: var(--warn); }

  /* ── FAVORITES DRAWER ── */
  #fav-drawer {
    position: fixed;
    top: 0;
    right: -380px;
    width: 360px;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 500;
    display: flex;
    flex-direction: column;
    transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -4px 0 24px rgba(0,0,0,0.4);
  }
  #fav-drawer.open { right: 0; }

  #fav-drawer-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #fav-drawer-header h3 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
  }
  #fav-drawer-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.3rem;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.15s;
  }
  #fav-drawer-close:hover { color: var(--text); }

  #fav-drawer-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 0;
  }

  .fav-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 20px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  .fav-item:hover { background: var(--surface2); }
  .fav-item-body { flex: 1; min-width: 0; }
  .fav-item-title {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .fav-item-meta {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .fav-delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    flex-shrink: 0;
    transition: color 0.15s;
    line-height: 1;
    align-self: center;
  }
  .fav-delete-btn:hover { color: var(--danger); }

  #fav-drawer-empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  /* drawer overlay */
  #fav-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 499;
  }
  #fav-overlay.visible { display: block; }

  /* responsive */
  @media (max-width: 640px) {
    .hero { padding: 20px 16px; }
    .hero h1 { font-size: 1.4rem; }
    #result-wrapper { padding: 0 8px; }
    #doc-output { padding: 16px 12px; }
    .search-box { flex-direction: column; gap: 8px; }
    .search-box input { width: 100%; }
    .search-box button { width: 100%; padding: 12px; }
    /* step grid — tighter on small screens */
    #doc-output .step-item {
      grid-template-columns: 28px 1fr;
      gap: 10px;
    }
    /* callouts must not overflow viewport */
    #doc-output .callout {
      padding: 10px 12px;
      word-break: break-word;
    }
    /* tables scroll horizontally instead of overflowing */
    #doc-output .data-table {
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
    }
    /* images fit the screen */
    #doc-output img {
      max-width: 100%;
      height: auto;
    }
    /* source chips wrap */
    #source-chips { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Dynamic <span>Docs</span></div>
  <div id="header-right" style="display:flex;align-items:center;gap:14px;font-size:0.88rem;color:var(--muted);">
    <span id="header-email" style="color:var(--text)"></span>
    <button id="fav-toggle-btn" onclick="toggleDrawer()">★ Favorites</button>
    <a id="header-settings" href="/settings" style="color:var(--muted);text-decoration:none;display:none">Settings</a>
    <form action="/logout" method="post" style="margin:0">
      <button type="submit" style="background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:0.82rem;font-family:var(--font);transition:border-color 0.15s,color 0.15s"
        onmouseover="this.style.borderColor='#e74c3c';this.style.color='#e74c3c'"
        onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
        Log out
      </button>
    </form>
  </div>
</header>

<div class="hero">
  <h1>Field Service Knowledge Base</h1>
  <p>Ask any question about your service documentation — get a complete documentation page instantly.</p>

  <div class="search-box">
    <input type="text" id="query-input" placeholder="Ask anything about your documentation…" autofocus />
    <button id="generate-btn" onclick="generateDoc()">Generate Docs</button>
  </div>

  </div>

</div>

<div id="result-wrapper">
  <div class="result-meta">
    <span>Results for:</span>
    <span class="query-badge" id="query-display"></span>
    <div class="source-chips" id="source-chips"></div>
    <button id="save-btn" onclick="saveFavorite()">☆ Save</button>
  </div>
  <div id="doc-output">
    <div class="empty-state">
      <div class="icon">📄</div>
      <p>Your documentation will appear here</p>
    </div>
  </div>
</div>

<!-- Favorites drawer -->
<div id="fav-overlay" onclick="toggleDrawer()"></div>
<div id="fav-drawer">
  <div id="fav-drawer-header">
    <h3>★ Saved Favorites</h3>
    <button id="fav-drawer-close" onclick="toggleDrawer()" title="Close">✕</button>
  </div>
  <div id="fav-drawer-list">
    <div id="fav-drawer-empty">No favorites saved yet.</div>
  </div>
</div>

<script>
  const input = document.getElementById('query-input');
  const btn = document.getElementById('generate-btn');
  const wrapper = document.getElementById('result-wrapper');
  const output = document.getElementById('doc-output');
  const queryDisplay = document.getElementById('query-display');
  const sourceChips = document.getElementById('source-chips');
  const saveBtn = document.getElementById('save-btn');
  const favToggleBtn = document.getElementById('fav-toggle-btn');
  const favDrawer = document.getElementById('fav-drawer');
  const favOverlay = document.getElementById('fav-overlay');
  const favDrawerList = document.getElementById('fav-drawer-list');
  const favDrawerEmpty = document.getElementById('fav-drawer-empty');

  // Track current result state for saving
  let currentQuery = '';
  let currentSources = [];
  let currentFavId = null; // null = not saved, number = saved with this id

  // ── Header user info ──────────────────────────────────
  fetch('/api/me').then(r => r.json()).then(user => {
    document.getElementById('header-email').textContent = user.email;
    if (user.role === 'admin') {
      document.getElementById('header-settings').style.display = 'inline';
    }
  }).catch(() => {});

  // ── Favorites: load list on page load ─────────────────
  let favoritesCache = [];

  async function loadFavorites() {
    try {
      const r = await fetch('/api/favorites');
      favoritesCache = await r.json();
      renderFavList();
      favToggleBtn.style.display = favoritesCache.length > 0 ? 'inline-block' : 'none';
    } catch(e) {}
  }

  function renderFavList() {
    if (!favoritesCache.length) {
      favDrawerList.innerHTML = '<div id="fav-drawer-empty">No favorites saved yet.</div>';
      return;
    }
    favDrawerList.innerHTML = favoritesCache.map(f => `
      <div class="fav-item" data-id="${f.id}">
        <div class="fav-item-body" onclick="loadFavorite(${f.id})">
          <div class="fav-item-title" title="${escHtml(f.query)}">${escHtml(f.title || f.query)}</div>
          <div class="fav-item-meta">${escHtml(f.sources.join(', '))} · ${f.created_at}</div>
        </div>
        <button class="fav-delete-btn" onclick="deleteFavorite(${f.id}, event)" title="Remove">🗑</button>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Drawer open/close ─────────────────────────────────
  function toggleDrawer() {
    const isOpen = favDrawer.classList.contains('open');
    if (isOpen) {
      favDrawer.classList.remove('open');
      favOverlay.classList.remove('visible');
    } else {
      loadFavorites(); // refresh list each open
      favDrawer.classList.add('open');
      favOverlay.classList.add('visible');
    }
  }

  // ── Load a favorite into the result area ──────────────
  async function loadFavorite(id) {
    try {
      const r = await fetch(`/api/favorites/${id}`);
      const fav = await r.json();

      currentQuery = fav.query;
      currentSources = fav.sources;
      currentFavId = fav.id;

      queryDisplay.textContent = fav.query;
      sourceChips.innerHTML = fav.sources.map(s =>
        `<span class="source-chip">📖 ${s}</span>`
      ).join('');
      output.innerHTML = fav.html_content;
      fixStepItems(output);
      wrapper.classList.add('visible');

      setSaveBtnState(true);

      // Close drawer and scroll
      favDrawer.classList.remove('open');
      favOverlay.classList.remove('visible');
      wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch(e) {
      alert('Failed to load favorite.');
    }
  }

  // ── Save current result ───────────────────────────────
  async function saveFavorite() {
    if (!currentQuery || !output.innerHTML.includes('doc-header')) return;

    // Extract title from the rendered <h1> inside doc-header
    const h1 = output.querySelector('.doc-header h1');
    const title = h1 ? h1.textContent.trim() : currentQuery;

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    try {
      const r = await fetch('/api/favorites', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query: currentQuery,
          title: title,
          html_content: output.innerHTML,
          sources: currentSources,
        })
      });
      const data = await r.json();
      currentFavId = data.id;
      setSaveBtnState(true);

      // Refresh favorites list + show header button
      await loadFavorites();
    } catch(e) {
      saveBtn.disabled = false;
      saveBtn.textContent = '☆ Save';
    }
  }

  // ── Delete a favorite ─────────────────────────────────
  async function deleteFavorite(id, e) {
    e.stopPropagation();
    try {
      await fetch(`/api/favorites/${id}`, { method: 'DELETE' });
      favoritesCache = favoritesCache.filter(f => f.id !== id);
      renderFavList();
      favToggleBtn.style.display = favoritesCache.length > 0 ? 'inline-block' : 'none';

      // If the currently displayed result was this favorite, reset save button
      if (currentFavId === id) {
        currentFavId = null;
        setSaveBtnState(false);
      }
    } catch(e) {
      alert('Failed to delete favorite.');
    }
  }

  // ── Save button visual state ──────────────────────────
  function setSaveBtnState(saved) {
    saveBtn.disabled = false;
    if (saved) {
      saveBtn.textContent = '★ Saved';
      saveBtn.classList.add('saved');
      saveBtn.onclick = null; // prevent double-save
    } else {
      saveBtn.textContent = '☆ Save';
      saveBtn.classList.remove('saved');
      saveBtn.onclick = saveFavorite;
    }
  }

  // ── Fix step items (unchanged) ────────────────────────
  function fixStepItems(container) {
    container.querySelectorAll('.step-item').forEach(item => {
      Array.from(item.childNodes).forEach(node => {
        if (node.nodeType === Node.TEXT_NODE && node.textContent.trim()) {
          const p = document.createElement('p');
          p.textContent = node.textContent;
          item.replaceChild(p, node);
        }
      });
      item.querySelectorAll('.step-phase').forEach(phase => {
        item.parentNode.insertBefore(phase, item);
      });
      item.querySelectorAll('.callout').forEach(callout => {
        item.parentNode.insertBefore(callout, item.nextSibling);
      });
    });
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') generateDoc();
  });

  function setQuery(el) {
    input.value = el.textContent;
    input.focus();
  }

  async function generateDoc() {
    const query = input.value.trim();
    if (!query) return;

    btn.disabled = true;
    btn.textContent = 'Generating…';
    queryDisplay.textContent = query;
    sourceChips.innerHTML = '';
    wrapper.classList.add('visible');

    // Reset save state for new result
    currentQuery = query;
    currentSources = [];
    currentFavId = null;
    saveBtn.style.display = 'none';
    setSaveBtnState(false);

    output.innerHTML = '<div class="loading-bar"></div><p style="color:var(--muted);font-size:0.9rem;" id="progress-msg">Sending full knowledge base to AI and generating documentation…</p>';

    let accumulated = '';
    let chunkCount = 0;

    try {
      const resp = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });

      if (!resp.ok) {
        const err = await resp.json();
        output.innerHTML = `<div class="callout danger"><strong>Error</strong>${err.error || 'Unknown error'}</div>`;
        return;
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let done = false;
      let sourcesData = null;

      while (!done) {
        const { done: streamDone, value } = await reader.read();
        if (streamDone) break;

        const lines = decoder.decode(value).split('\n');
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.slice(6));
            if (data.error) {
              output.innerHTML = `<div class="callout danger"><strong>Error</strong>${data.error}</div>`;
              done = true;
              break;
            }
            if (data.done) {
              sourcesData = data.sources;
              done = true;
              break;
            }
            if (data.text) {
              accumulated += data.text;
              chunkCount++;
              const msg = document.getElementById('progress-msg');
              if (msg) msg.textContent = `Receiving response… (${Math.round(accumulated.length / 1024)}KB)`;
            }
          } catch(e) {}
        }
      }

      // Render once, fully, after streaming is complete
      if (accumulated) {
        output.innerHTML = accumulated;
        fixStepItems(output);
        if (sourcesData) {
          currentSources = sourcesData;
          sourceChips.innerHTML = sourcesData.map(s =>
            `<span class="source-chip">📖 ${s}</span>`
          ).join('');
        }
        // Check if this query is already a favorite
        const existing = favoritesCache.find(f => f.query === query);
        if (existing) {
          currentFavId = existing.id;
          setSaveBtnState(true);
        } else {
          setSaveBtnState(false);
        }
        saveBtn.style.display = 'inline-block';
        wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

    } catch (e) {
      output.innerHTML = `<div class="callout danger"><strong>Error</strong>${e.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate Docs';
    }
  }

  // Init: load favorites on page load
  loadFavorites();
</script>
</body>
</html>
