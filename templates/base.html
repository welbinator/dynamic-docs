<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Dynamic Docs{% endblock %}</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2d3250;
    --accent: #4f7ef7;
    --accent2: #7c5cbf;
    --text: #e8eaf6;
    --muted: #7c83a3;
    --danger: #e74c3c;
    --warn: #f39c12;
    --success: #27ae60;
    --info: #2980b9;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Consolas', 'SF Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    min-height: 52px;
  }
  header .logo {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  header .logo span { color: var(--muted); font-weight: 400; }

  .header-spacer { flex: 1; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.88rem;
    color: var(--muted);
    flex-shrink: 0;
  }
  .header-right a {
    color: var(--muted);
    text-decoration: none;
    white-space: nowrap;
  }
  .header-right a:hover { color: var(--text); }
  .user-email {
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
  }
  .logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.82rem;
    font-family: var(--font);
    transition: border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

  @media (max-width: 540px) {
    header { padding: 10px 14px; gap: 8px; }
    /* hide email on small screens */
    .user-email { display: none; }
    /* settings → ⚙ icon */
    .header-settings-link .btn-text { display: none; }
    .header-settings-link::before { content: '⚙'; }
    /* logout → ⏻ icon */
    .logout-btn .btn-text { display: none; }
    .logout-btn::after { content: '⏻'; font-size: 1rem; }
  }

  /* ── AUTH CARD ── */
  .auth-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 440px;
  }
  .auth-card h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .auth-card .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 28px;
  }
  .auth-card .subtitle .org-name {
    color: var(--accent);
    font-weight: 600;
  }

  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 0.95rem;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--accent); }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font);
    transition: background 0.15s;
    margin-top: 6px;
  }
  .btn-primary:hover { background: #3a67e0; }

  .error-msg {
    background: rgba(231,76,60,0.1);
    border: 1px solid rgba(231,76,60,0.4);
    color: #f5a49a;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.88rem;
    margin-bottom: 20px;
  }
  .auth-footer {
    margin-top: 24px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .auth-footer a { color: var(--accent); text-decoration: none; }
  .auth-footer a:hover { text-decoration: underline; }

  /* ── SETTINGS layout ── */
  .page-wrapper {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    width: 100%;
  }
  .page-title {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .page-subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 36px; }

  .settings-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 32px;
    margin-bottom: 24px;
  }
  .settings-card h2 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings-card .card-desc {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 22px;
  }

  .inline-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .inline-form .form-group { flex: 1; min-width: 180px; margin-bottom: 0; }
  .btn-save {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font);
    white-space: nowrap;
    transition: background 0.15s;
    align-self: flex-end;
  }
  .btn-save:hover { background: #3a67e0; }
  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid rgba(231,76,60,0.4);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: var(--font);
    transition: background 0.15s;
  }
  .btn-danger:hover { background: rgba(231,76,60,0.1); }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: var(--font);
    transition: border-color 0.15s;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .toast {
    background: rgba(39,174,96,0.15);
    border: 1px solid rgba(39,174,96,0.4);
    color: #7afaa8;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.88rem;
    margin-bottom: 20px;
  }

  /* invite link row */
  .invite-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .invite-url {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--muted);
    font-size: 0.82rem;
    font-family: var(--font);
    word-break: break-all;
    min-width: 200px;
  }

  /* radio group */
  .radio-group { display: flex; flex-direction: column; gap: 12px; }
  .radio-option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .radio-option:has(input:checked) { border-color: var(--accent); }
  .radio-option input[type=radio] { margin-top: 3px; accent-color: var(--accent); }
  .radio-option .option-label { font-weight: 600; font-size: 0.9rem; margin-bottom: 2px; }
  .radio-option .option-desc { font-size: 0.82rem; color: var(--muted); }

  /* member table */
  .member-table { width: 100%; border-collapse: collapse; }
  .member-table th {
    text-align: left;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    padding: 0 0 10px;
    border-bottom: 1px solid var(--border);
  }
  .member-table td {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
    vertical-align: middle;
  }
  .member-table tr:last-child td { border-bottom: none; }
  .role-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .role-badge.admin {
    background: rgba(79,126,247,0.15);
    color: var(--accent);
    border: 1px solid rgba(79,126,247,0.3);
  }
  .role-badge.employee {
    background: rgba(124,91,191,0.15);
    color: #a98bf5;
    border: 1px solid rgba(124,91,191,0.3);
  }

  /* select */
  .form-group select {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 0.95rem;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
    cursor: pointer;
  }
  .form-group select:focus { border-color: var(--accent); }

  @media (max-width: 600px) {
    .auth-card { padding: 28px 20px; }
    .settings-card { padding: 20px 16px; }
    .page-wrapper { padding: 24px 12px 60px; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>

<header>
  <a href="/" class="logo">Dynamic <span>Docs</span></a>
  <div class="header-spacer"></div>
  <div class="header-right">
    {% if current_user.is_authenticated %}
      <span class="user-email">{{ current_user.email }}</span>
      {% block header_extra %}{% endblock %}
      {% if current_user.is_admin %}
        <a href="/settings" class="header-settings-link"><span class="btn-text">Settings</span></a>
      {% endif %}
      <form action="/logout" method="post" style="margin:0">
        <button type="submit" class="logout-btn"><span class="btn-text">Log out</span></button>
      </form>
    {% endif %}
  </div>
</header>

{% block body %}{% endblock %}

</body>
</html>
